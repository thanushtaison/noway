<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments::head('Register')}"></head>
<body>
<div th:replace="~{fragments::navbar}"></div>

<main class="auth-main container">
    <div class="auth-card">
        <h2>Create your account</h2>
        <p class="auth-subtitle">Join NO WAY today and start shopping.</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" th:value="${name}" placeholder="Your full name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" th:value="${email}" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Minimum 8 characters" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required>
            </div>
            <div class="form-group">
                <label for="role">Register as</label>
                <select id="role" name="role" required>
                    <option value="BUYER" th:selected="${role == null or role == 'BUYER'}">Buyer</option>
                    <option value="SELLER" th:selected="${role == 'SELLER'}">Seller</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>

        <p class="auth-footer">Already have an account? <a th:href="@{/login}">Login here</a></p>
    </div>
</main>

<div th:replace="~{fragments::footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
