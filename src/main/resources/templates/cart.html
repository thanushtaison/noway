<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments::head('Cart')}"></head>
<body>
<div th:replace="~{fragments::navbar}"></div>

<main class="container page" th:with="cart=${cart}">
    <div class="page-header">
        <h1>Shopping Cart</h1>
    </div>

    <div th:if="${cart.items.isEmpty()}" class="empty-state">
        <p>Your cart is empty.</p>
        <a class="btn btn-primary" th:href="@{/products}">Continue Shopping</a>
    </div>

    <div th:if="${!cart.items.isEmpty()}">
        <div class="table-wrap">
            <table class="table cart-table">
                <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cart.items}">
                    <td class="cart-product">
                        <img th:src="@{${item.imageUrl}}" th:alt="${item.name}">
                        <a th:href="@{/products/{id}(id=${item.productId})}" th:text="${item.name}">Product</a>
                    </td>
                    <td th:text="'₹' + ${#numbers.formatDecimal(item.price, 1, 'COMMA', 0, 'POINT')}">₹0</td>
                    <td>
                        <div class="qty-control">
                            <button type="button" th:attr="onclick=|updateCartItem(${item.id}, ${item.quantity - 1})|">&#8722;</button>
                            <input type="number" th:value="${item.quantity}" min="1" th:max="${item.stock}" readonly>
                            <button type="button" th:attr="onclick=|updateCartItem(${item.id}, ${item.quantity + 1})|">&#43;</button>
                        </div>
                    </td>
                    <td class="cart-subtotal" th:text="'₹' + ${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 0, 'POINT')}">₹0</td>
                    <td>
                        <button class="btn btn-danger btn-sm" th:attr="onclick=|removeCartItem(${item.id})|">Remove</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="cart-summary">
            <p><span>Total Items:</span> <strong th:text="${cart.totalItems}">0</strong></p>
            <p><span>Total Amount:</span> <strong class="total-amount"
                th:text="'₹' + ${#numbers.formatDecimal(cart.totalAmount, 1, 'COMMA', 0, 'POINT')}">₹0</strong></p>
            <div class="summary-actions">
                <a class="btn btn-outline" th:href="@{/products}">Continue Shopping</a>
                <a class="btn btn-primary" th:href="@{/checkout}">Proceed to Checkout</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments::footer}"></div>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
