<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments::head('Order Details')}"></head>
<body>
<div th:replace="~{fragments::navbar}"></div>

<main class="container page" th:with="o=${order}">
    <div class="page-header">
        <h1>Order <span th:text="'#' + ${o.id}">#1</span></h1>
        <p class="muted" th:text="'Placed on ' + ${o.createdAtText}">date</p>
    </div>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Subtotal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${o.items}">
                <td th:text="${item.productName}">Product</td>
                <td th:text="'₹' + ${#numbers.formatDecimal(item.price, 1, 'COMMA', 0, 'POINT')}">₹0</td>
                <td th:text="${item.quantity}">1</td>
                <td th:text="'₹' + ${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 0, 'POINT')}">₹0</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="checkout-summary card">
        <p class="summary-line"><span>Total Amount:</span> <strong class="total-amount"
            th:text="'₹' + ${#numbers.formatDecimal(o.totalAmount, 1, 'COMMA', 0, 'POINT')}">₹0</strong></p>
        <p class="summary-line"><span>Status:</span> <strong th:text="${o.status.name()}">CONFIRMED</strong></p>
        <div class="summary-actions">
            <a class="btn btn-outline" th:href="@{/products}">Continue Shopping</a>
            <a class="btn btn-primary" th:href="@{/orders}">Back to Orders</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments::footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
