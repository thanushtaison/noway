<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments::head('Checkout')}"></head>
<body>
<div th:replace="~{fragments::navbar}"></div>

<main class="container page" th:with="cart=${cart}">
    <div class="page-header">
        <h1>Checkout</h1>
    </div>

    <div class="checkout-grid">
        <div class="checkout-items">
            <div class="table-wrap">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Qty</th>
                        <th>Subtotal</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${cart.items}">
                        <td th:text="${item.name}">Product</td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(item.price, 1, 'COMMA', 0, 'POINT')}">₹0</td>
                        <td th:text="${item.quantity}">1</td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 0, 'POINT')}">₹0</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="checkout-summary card">
            <h3>Order Summary</h3>
            <p class="summary-line"><span>Total Items:</span> <strong th:text="${cart.totalItems}">0</strong></p>
            <p class="summary-line"><span>Total:</span> <strong class="total-amount"
                th:text="'₹' + ${#numbers.formatDecimal(cart.totalAmount, 1, 'COMMA', 0, 'POINT')}">₹0</strong></p>
            <p class="note">Demo checkout - no real payment is processed.</p>
            <form th:action="@{/checkout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-primary btn-block btn-lg">Confirm Order</button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments::footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
