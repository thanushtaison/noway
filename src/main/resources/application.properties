spring.application.name=noway
server.port=${PORT:8080}

# MySQL - Database "noway" is created automatically on first start
# Override credentials via environment variables so passwords are never committed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/noway?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
