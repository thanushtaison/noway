spring.application.name=noway
server.port=${PORT:8080}

# Local dev default: embedded H2 database so the app runs without a MySQL server.
# Set DB_URL/DB_USERNAME/DB_PASSWORD in production or when you want MySQL instead.
spring.datasource.url=${DB_URL:jdbc:h2:mem:noway;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# Thymeleaf
spring.thymeleaf.cache=false
