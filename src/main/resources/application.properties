spring.application.name=noway
server.port=${PORT:8080}

# Local dev default: embedded H2 database so the app runs without a MySQL server.
# Set DB_URL/DB_USERNAME/DB_PASSWORD in production or when you want MySQL instead.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# Thymeleaf
spring.thymeleaf.cache=false


